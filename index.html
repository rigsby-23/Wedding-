<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Welcome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #d0b9a5;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .design {
      display: block;
      width: 100%;
      height: auto;
    }

    .welcome-button {
      position: absolute;
      left: 9.5%;
      top: 75.8%;
      width: 50%;
      height: 6.8%;
      display: block;
      cursor: pointer;
      border-radius: 30px;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <main class="page">
    <img
      src="welcome.png"
      alt="Wedding welcome invitation"
      class="design"
    >

    <a
      class="welcome-button"
      href="./invitation.html"
      aria-label="View Invitation"
    ></a>
  </main>

</body>
</html>
