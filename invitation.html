<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments of Love</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #d0b9a5;
    }

    img {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto;
      animation: appear 1s ease;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      img {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <img
    src="moments.jpg"
    alt="Moments of Love wedding invitation"
  >

</body>
</html>
