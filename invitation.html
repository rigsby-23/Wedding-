
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #d0b9a5;
    }

    body {font-family: Georgia, serif;
      margin: 0;
      padding: 0;
      background: #d0b9a5;
      font-family: Georgia, serif;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .design {
  display: block;
  width: 100%;
  height: auto;
  animation: waveMove 2s ease-in-out infinite alternate;
}

@keyframes waveMove {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-30px);
  }
}

@keyframes waveMove {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-15px);
  }
}

    . .animate {
  animation: appear 1.5s ease both;
}

.design {
  display: block;
  width: 100%;
  height: auto;
  animation: gentleWave 4s ease-in-out infinite;
}

@keyframes gentleWave {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    .location-button {
  position: absolute;
  left: 30%;
  top: 89.5%;
  width: 40%;
  height: 3.5%;
  display: block;
  background: transparent;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .animate {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- MOMENTS OF LOVE -->
  <section class="page animate">
    <img
      src="moments.jpg"
      alt="Moments of Love wedding invitation"
      class="design"
    >
  </section>

  <!-- THE BIG DAY: CONTINUES BELOW MOMENTS OF LOVE -->
  <section class="page animate">
    <img
      src="bigday.jpg"
      alt="The Big Day wedding invitation"
      class="design"
    >

    <a class="location-button"
   href="https://maps.app.goo.gl/s4sHYb96m51uBpkJ8"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="View Location">
</a>
  </section>

</body>
</html>
