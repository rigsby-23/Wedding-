
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #d0b9a5;
    }

    body {
      margin: 0;
      padding: 0;
      background: #d0b9a5;
      font-family: Georgia, serif;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .design {
      display: block;
      width: 100%;
      height: auto;
    }

    .animate {
      animation: appear 1s ease both;
    }

    .location-button {
      position: absolute;
      left: 30%;
      top: 77.2%;
      width: 40%;
      height: 4%;
      border: none;
      border-radius: 30px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .animate {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- MOMENTS OF LOVE -->
  <section class="page animate">
    <img
      src="moments.jpg"
      alt="Moments of Love wedding invitation"
      class="design"
    >
  </section>

  <!-- THE BIG DAY: CONTINUES BELOW MOMENTS OF LOVE -->
  <section class="page animate">
    <img
      src="bigday.jpg"
      alt="The Big Day wedding invitation"
      class="design"
    >

    <a class="location-button"
   href="https://maps.app.goo.gl/s4sHYb96m51uBpkJ8"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="View Location">
    </a>
  </section>

</body>
</html>
